services:
  m3u8-dl:
    build:
      context: .
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8080:8080"
    volumes:
      - ./movies:/output     # downloaded .mp4 files land here
    environment:
      M3U8DL_OUTPUT_DIR: /output
      M3U8DL_HEADLESS: "true"
      M3U8DL_CAPTURE_MODE: auto
      M3U8DL_PREFERRED_QUALITY: best
      M3U8DL_MAX_PARALLEL_DOWNLOADS: "6"