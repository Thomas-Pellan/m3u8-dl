services:
  m3u8-dl:
    build:
      context: .
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    user: "${UID:-1000}:${GID:-1000}"
    init: true
    ports:
      - "${M3U8DL_PORT}:8080"
    volumes:
      - ${M3U8DL_OUTPUT_DIR}:/output     # downloaded .mp4 files land here
    environment:
      M3U8DL_HEADLESS: "true"