server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json text/javascript;

    # Proxy all /api/* requests to the backend, stripping the /api prefix
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Required for SSE: disable buffering so events stream immediately
        proxy_set_header  Connection '';
        proxy_buffering   off;
        proxy_cache       off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback — serves index.html for all non-asset routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
